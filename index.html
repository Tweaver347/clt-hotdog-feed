    <script>
      (() => {
        try {
          const saved = JSON.parse(
            localStorage.getItem("clt-hotdog-preferences") || "{}"
          );
          const systemDark = window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches;
          const theme =
            saved.theme === "dark" || saved.theme === "light"
              ? saved.theme
              : systemDark
                ? "dark"
                : "light";

          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.textScale =
            saved.textScale || "default";
          document.documentElement.classList.toggle(
            "high-contrast",
            Boolean(saved.highContrast)
          );
          document.documentElement.classList.toggle(
            "reduce-motion",
            Boolean(saved.reduceMotion)
          );
          document.documentElement.classList.toggle(
            "hide-decorations",
            saved.showDecorations === false
          );
          document.documentElement.classList.toggle(
            "underline-links",
            Boolean(saved.underlineLinks)
          );
        } catch {
          // Continue with the app's default display preferences.
        }
      })();
    </script>

    <link rel="preconnect" href="https://unpkg.com" />
